# Publishes the shared packages to CodeArtifact.
#
# Triggered by a version tag. The reusable workflow publishes one package per
# call, so the matrix fans out over the workspaces. Each call is idempotent: it
# looks the version up in the repository first and skips one that is already
# there, so a re-run of a tag is green rather than a failure.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publish order matters. api-client is a runtime dependency of auth, and both
  # config packages are devDependencies of the rest, so the leaves go first and
  # a consumer never resolves a version whose dependency is not yet on the
  # registry. The dependency edges here are the ones in the package manifests.
  foundations:
    strategy:
      # Not fail-fast: one package failing should not cancel siblings that have
      # already uploaded, since a partial publish is resumable and a cancelled
      # one is harder to reason about.
      fail-fast: false
      matrix:
        package:
          - tsconfig
          - eslint-config
          - api-client
          - config
    uses: WebbPulse/.github/.github/workflows/codeartifact-publish-npm.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      node-version: '22'
      working-directory: packages/${{ matrix.package }}
      package-manager: 'npm'
      # Re-installs and builds from the repository root rather than from the
      # package directory the reusable workflow cds into.
      #
      # The workflow's own install step already ran npm ci here, but in a
      # workspaces repository that installs only this package's own
      # dependencies. tsup and typescript are root devDependencies, so the
      # build would fail on a missing binary. Installing with --prefix at the
      # root populates the shared node_modules, and building through
      # --workspace still writes dist into this package directory, which is
      # where the publish step that follows runs.
      #
      # --if-present because tsconfig and eslint-config ship their source
      # files directly and define no build script.
      build-command: >-
        npm ci --no-progress --prefix ../..
        && npm run build --if-present --prefix ../..
        --workspace "@webbpulse/${{ matrix.package }}"
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      aws-region: us-west-2
      environment: publish
    secrets:
      role-to-assume: ${{ secrets.CODEARTIFACT_PUBLISH_ROLE_ARN }}
      codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}

  # auth depends on api-client, so it goes after the first wave.
  dependents:
    needs: foundations
    strategy:
      fail-fast: false
      matrix:
        package:
          - auth
    uses: WebbPulse/.github/.github/workflows/codeartifact-publish-npm.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      node-version: '22'
      working-directory: packages/${{ matrix.package }}
      package-manager: 'npm'
      # Same reasoning as the foundations job above: install at the root so the
      # shared devDependencies are present, then build this one workspace.
      build-command: >-
        npm ci --no-progress --prefix ../..
        && npm run build --if-present --prefix ../..
        --workspace "@webbpulse/${{ matrix.package }}"
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      aws-region: us-west-2
      environment: publish
    secrets:
      role-to-assume: ${{ secrets.CODEARTIFACT_PUBLISH_ROLE_ARN }}
      codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}
