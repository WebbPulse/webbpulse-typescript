name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit is on main
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail unless the commit is an ancestor of main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Not on main::$GITHUB_SHA is not an ancestor of origin/main, refusing to publish."
            exit 1
          fi

  foundations:
    name: Publish the packages no other workspace depends on
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        package:
          - tsconfig
          - eslint-config
          - api-client
          - config
          - qrcode
    uses: WebbPulse/.github/.github/workflows/codeartifact-publish-npm.yml@v3
    permissions:
      id-token: write
      contents: read
    with:
      node-version: '22'
      working-directory: packages/${{ matrix.package }}
      package-manager: 'npm'
      cache-dependency-path: package-lock.json
      install-command: npm ci --no-progress --prefix ../..
      build-command: >-
        npm run build --if-present --prefix ../..
        --workspace "@webbpulse/${{ matrix.package }}"
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      aws-region: us-west-2
      environment: publish
    secrets:
      role-to-assume: ${{ secrets.CODEARTIFACT_PUBLISH_ROLE_ARN }}
      codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}

  dependents:
    name: Publish the packages that depend on the first wave
    needs: foundations
    strategy:
      fail-fast: false
      matrix:
        package:
          - auth
    uses: WebbPulse/.github/.github/workflows/codeartifact-publish-npm.yml@v3
    permissions:
      id-token: write
      contents: read
    with:
      node-version: '22'
      working-directory: packages/${{ matrix.package }}
      package-manager: 'npm'
      cache-dependency-path: package-lock.json
      install-command: npm ci --no-progress --prefix ../..
      build-command: >-
        npm run build --if-present --prefix ../..
        --workspace "@webbpulse/${{ matrix.package }}"
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      aws-region: us-west-2
      environment: publish
    secrets:
      role-to-assume: ${{ secrets.CODEARTIFACT_PUBLISH_ROLE_ARN }}
      codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}

  second-order:
    name: Publish the packages that depend on the second wave
    needs: dependents
    strategy:
      fail-fast: false
      matrix:
        package:
          - discovery
    uses: WebbPulse/.github/.github/workflows/codeartifact-publish-npm.yml@v3
    permissions:
      id-token: write
      contents: read
    with:
      node-version: '22'
      working-directory: packages/${{ matrix.package }}
      package-manager: 'npm'
      cache-dependency-path: package-lock.json
      install-command: npm ci --no-progress --prefix ../..
      build-command: >-
        npm run build --if-present --prefix ../..
        --workspace "@webbpulse/${{ matrix.package }}"
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      aws-region: us-west-2
      environment: publish
    secrets:
      role-to-assume: ${{ secrets.CODEARTIFACT_PUBLISH_ROLE_ARN }}
      codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}
