# Continuous integration for the shared TypeScript packages.
#
# The heavy lifting is in the organisation's reusable workflow. This file only
# supplies the inputs that differ for a package repository rather than a Vite
# application: the working directory is the repository root, not frontend/, and
# the build runs across every workspace.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    uses: WebbPulse/.github/.github/workflows/typescript-ci.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      node-version: '22'
      # The reusable workflow defaults this to frontend/, which is right for the
      # two applications and wrong here: package.json is at the repository root.
      working-directory: '.'
      package-manager: 'npm'
      lint-command: 'npm run lint'
      format-check-command: 'npm run format:check'
      typecheck-command: 'npm run type-check'
      test-command: 'npm run test:run -- --coverage'
      build-command: 'npm run build'
      # No CodeArtifact login. This repository publishes the @webbpulse scope
      # rather than consuming it, so every dependency resolves from the public
      # registry and CI needs no AWS credentials to install.

  # A published package that changes without a changeset is a package that
  # ships under a version already on the registry, which the publish workflow
  # then skips as a duplicate. Catching it here is cheaper than working out
  # afterwards why a release did nothing.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a changeset when a package changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'packages/**' || true)
          if [ -z "$CHANGED" ]; then
            echo "No package sources changed."
            exit 0
          fi
          # A release PR raised by the version step consumes the changesets it
          # is applying, so it legitimately carries none.
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '**/CHANGELOG.md' | grep -q .; then
            echo "Changelogs updated, treating this as a release pull request."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '.changeset/*.md' \
              | grep -v '.changeset/README.md' | grep -q .; then
            echo "Changeset present."
            exit 0
          fi
          echo "::error title=Missing changeset::Package sources changed but no changeset was added. Run 'npm run changeset'."
          exit 1
