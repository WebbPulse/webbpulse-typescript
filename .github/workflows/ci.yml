name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: typescript
    uses: WebbPulse/.github/.github/workflows/typescript-ci.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      node-version: '22'
      working-directory: '.'
      package-manager: 'npm'
      lint-command: 'npm run lint'
      format-check-command: 'npm run format:check'
      typecheck-command: 'npm run type-check'
      test-command: 'npm run test:run -- --coverage'
      build-command: 'npm run build'

  changeset:
    name: changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a changeset when a package changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'packages/**' || true)
          if [ -z "$CHANGED" ]; then
            echo "No package sources changed."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '**/CHANGELOG.md' | grep -q .; then
            echo "Changelogs updated, treating this as a release pull request."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '.changeset/*.md' \
              | grep -v '.changeset/README.md' | grep -q .; then
            echo "Changeset present."
            exit 0
          fi
          echo "::error title=Missing changeset::Package sources changed but no changeset was added. Run 'npm run changeset'."
          exit 1

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [typescript, changeset]
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
